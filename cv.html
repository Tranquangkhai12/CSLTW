<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sản Phẩm</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script> 

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            padding-top: 56px; /* Đảm bảo navbar không chồng lên nội dung */
        }

        .product-card {
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease; /* Hiệu ứng chuyển đổi cho thẻ sản phẩm */
        }

        .product-card:hover {
            transform: scale(1.05); /* Nổi bật khi di chuột qua */
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease; /* Hiệu ứng chuyển đổi cho overlay */
        }

        .product-card:hover .overlay {
            opacity: 1; /* Hiện overlay khi di chuột qua */
        }

        /* Nút thêm sửa xóa */
        .btn-custom {
            margin: 5px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Trang Công Nghệ</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Trang Chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#products">Sản Phẩm</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#cv">Lý Lịch</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#blog">Blog</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Products Section -->
    <div class="container mt-5" id="products">
        <h2>Quản Lý Sản Phẩm</h2>
        <button class="btn btn-primary mb-3" id="addProductBtn">Thêm Sản Phẩm</button>
        <div class="row" id="product-list">
            <!-- Sản phẩm sẽ được thêm vào đây thông qua JavaScript -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center">
        <p>© 2024 Trang Công Nghệ. All rights reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script>
        $(document).ready(function () {
            const productList = [
                { id: 1, name: 'Sản phẩm A', description: 'Mô tả sản phẩm A', image: 'product-a.jpg' },
                { id: 2, name: 'Sản phẩm B', description: 'Mô tả sản phẩm B', image: 'product-b.jpg' },
            ];

            function renderProducts() {
                $('#product-list').empty(); // Xóa nội dung cũ
                productList.forEach((product) => {
                    $('#product-list').append(`
                        <div class="col-md-4 mb-4">
                            <div class="card product-card">
                                <img src="${product.image}" class="card-img-top" alt="${product.name}">
                                <div class="overlay">
                                    <div>
                                        <h5>${product.name}</h5>
                                        <p>${product.description}</p>
                                        <button class="btn btn-danger btn-sm delete-product" data-id="${product.id}">Xóa</button>
                                        <button class="btn btn-warning btn-sm edit-product" data-id="${product.id}">Sửa</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `);
                });
            }

            // Xóa sản phẩm
            $(document).on('click', '.delete-product', function () {
                const id = $(this).data('id');
                const index = productList.findIndex(p => p.id === id);
                if (index !== -1) {
                    productList.splice(index, 1); // Xóa sản phẩm khỏi mảng
                    renderProducts(); // Render lại danh sách sản phẩm
                }
            });

            // Sửa sản phẩm
            $(document).on('click', '.edit-product', function () {
                const id = $(this).data('id');
                const product = productList.find(p => p.id === id);
                const newName = prompt('Nhập tên sản phẩm:', product.name);
                const newDescription = prompt('Nhập mô tả sản phẩm:', product.description);
                if (newName && newDescription) {
                    product.name = newName; // Cập nhật tên sản phẩm
                    product.description = newDescription; // Cập nhật mô tả sản phẩm
                    renderProducts(); // Render lại danh sách sản phẩm
                }
            });

            // Thêm sản phẩm mới
            $('#addProductBtn').on('click', function () {
                const newName = prompt('Nhập tên sản phẩm:');
                const newDescription = prompt('Nhập mô tả sản phẩm:');
                const newImage = prompt('Nhập đường dẫn tới hình ảnh sản phẩm:');
                if (newName && newDescription && newImage) {
                    const newProduct = {
                        id: productList.length + 1, // Tạo ID mới cho sản phẩm
                        name: newName,
                        description: newDescription,
                        image: newImage
                    };
                    productList.push(newProduct); // Thêm sản phẩm mới vào mảng
                    renderProducts(); // Render lại danh sách sản phẩm
                }
            });

            renderProducts(); // Hiển thị sản phẩm ban đầu
        });
    </script>
</body>
</html>
